<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Fast Downloader</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; color: #f43f5e; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        input, select { background: #334155; color: white; }
        button { background: #f43f5e; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e11d48; }
        #status { margin-top: 15px; word-break: break-all; font-size: 14px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ultra Fast Downloader</h2>
    <input type="text" id="videoUrl" placeholder="ইউটিউব ভিডিও লিংক পেস্ট করুন">
    
    <select id="quality">
        <option value="720p">720p (HD Fast)</option>
        <option value="1080p">1080p (Full HD)</option>
        <option value="360p">360p (Low Quality)</option>
        <option value="mp3">MP3 Audio</option>
    </select>

    <button onclick="startDownload()">অতি দ্রুত ডাউনলোড করুন</button>

    <div id="status"></div>
</div>

<script>
async function startDownload() {
    const url = document.getElementById('videoUrl').value;
    const quality = document.getElementById('quality').value;
    const statusDiv = document.getElementById('status');

    if (!url) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'অনুগ্রহ করে লিংক প্রদান করুন!';
        return;
    }

    statusDiv.className = '';
    statusDiv.innerText = 'প্রসেসিং হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...';

    try {
        const response = await fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, quality })
        });

        const data = await response.json();

        if (data.download_url) {
            statusDiv.className = 'success';
            statusDiv.innerHTML = `<a href="${data.download_url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline;">এখানে ক্লিক করে সরাসরি ডাউনলোড করুন</a>`;
            window.location.href = data.download_url;
        } else {
            statusDiv.className = 'error';
            statusDiv.innerText = data.error || 'ডাউনলোড ব্যর্থ হয়েছে!';
        }
    } catch (err) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'সার্ভার সমস্যা! আবার চেষ্টা করুন।';
    }
}
</script>

</body>
</html>
