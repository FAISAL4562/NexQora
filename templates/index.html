<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Fast Downloader</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 20px; color: #f43f5e; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        input, select { background: #334155; color: white; }
        button { background: #f43f5e; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e11d48; }
        #status { margin-top: 15px; word-break: break-all; font-size: 14px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ultra Fast Downloader</h2>
    <input type="text" id="videoUrl" placeholder="YouTube video link paste korun">
    
    <select id="quality">
        <option value="720">720p (HD)</option>
        <option value="1080">1080p (Full HD)</option>
        <option value="360">360p (SD)</option>
    </select>

    <button onclick="startDownload()">Oti Druto Download Korun</button>

    <div id="status"></div>
</div>

<script>
async function startDownload() {
    const url = document.getElementById('videoUrl').value;
    const statusDiv = document.getElementById('status');

    if (!url) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Onugroho kore link provadan korun!';
        return;
    }

    statusDiv.className = '';
    statusDiv.innerText = 'Processing hocche, ektu opekkha korun...';

    try {
        const response = await fetch('https://co.wuk.sh/api/json', {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (data.url) {
            statusDiv.className = 'success';
            statusDiv.innerHTML = `<a href="${data.url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline;">Ekhane click kore direct download korun</a>`;
            window.location.href = data.url;
        } else if (data.picker && data.picker.length > 0) {
            statusDiv.className = 'success';
            statusDiv.innerHTML = `<a href="${data.picker[0].url}" target="_blank" style="color: #38bdf8; font-weight: bold; text-decoration: underline;">Ekhane click kore direct download korun</a>`;
            window.location.href = data.picker[0].url;
        } else {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Link generate kora sombhob hoyni. Onno link try korun.';
        }
    } catch (err) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Network ba API connection e somoshya hocche. Onno link try korun.';
    }
}
</script>

</body>
</html>
